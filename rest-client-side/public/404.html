<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Chauka</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .wrap { max-width: 480px; }
    .code {
      font-size: 6rem;
      font-weight: 900;
      background: linear-gradient(135deg, #f7971e, #ffd200);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }
    h1 { font-size: 1.5rem; font-weight: 800; margin: 16px 0 8px; }
    p { color: #a8a29e; font-size: 0.95rem; line-height: 1.6; margin-bottom: 28px; }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 10px;
      background: linear-gradient(135deg, #f7971e, #ffd200);
      color: #0f0f1a;
      font-weight: 700;
      text-decoration: none;
      font-size: 0.92rem;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>This table's not on the floor</h1>
    <p>The page you're looking for doesn't exist on this restaurant server.<br>Head back to the control center to open a screen.</p>
    <a href="/app/hub/" class="btn">← Open Control Center</a>
  </div>
</body>
</html>
